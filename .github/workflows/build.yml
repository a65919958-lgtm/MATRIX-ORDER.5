
name: MATRIX ORDER Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Compilar para PS4
 uses: OpenOrbis/toolchain-action@main
        
        with:
          version: v0.5.1
          command: make

      - name: Guardar ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-ORDER-build
          path: eboot.bin
          if-no-files-found: error
