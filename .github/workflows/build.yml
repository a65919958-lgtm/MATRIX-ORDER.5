
name: MATRIX ORDER Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: openorbisofficial/toolchain:v0.5.1

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Compilar
        run: make

      - name: Guardar ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-ORDER-build
          path: eboot.bin
          if-no-files-found: error

